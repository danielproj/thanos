# Release verification. Runs ONLY for a pushed version tag and uses no secrets: it checks that the tag is on the
# default branch and that the tagged commit builds and passes every test. Signing, notarization and publishing
# happen on the maintainer's Mac with scripts/package-release.sh (see CONTRIBUTING.md › Releases), so signing keys
# never leave that machine.
name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ vars.THANOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
      - name: The tag must be on the default branch
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}"
      - name: The tag must match the changelog
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md
      - name: Build, test and check (no secrets)
        run: ./scripts/ci.sh
