# Release packaging. Runs ONLY for a pushed version tag. It repeats the secret-free CI, then — in the protected
# `release` environment, which needs a reviewer's approval and holds the only secrets — signs, notarizes and packages,
# and creates a DRAFT release that a person publishes. Signing needs a runner whose keychain holds the Developer ID
# identity and the notarytool profile (set THANOS_RUNNER to such a self-hosted runner). Nothing here runs for a pull request.
name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ vars.THANOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag must be on the default branch
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}"
      - run: ./scripts/ci.sh
  package:
    needs: verify
    runs-on: ${{ vars.THANOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    env:
      THANOS_DEVELOPER_ID: ${{ secrets.THANOS_DEVELOPER_ID }}
      THANOS_NOTARY_PROFILE: ${{ secrets.THANOS_NOTARY_PROFILE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package, sign and notarize
        run: ./scripts/package-release.sh --version "${GITHUB_REF_NAME#v}" --build "$GITHUB_RUN_NUMBER" --out "$RUNNER_TEMP/release"
      - name: Create a draft release (a person publishes it)
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Thanos ${GITHUB_REF_NAME#v} — Development Preview" \
            --notes-file "$RUNNER_TEMP/release/release-notes.md" "$RUNNER_TEMP/release"/Thanos-*.dmg \
            "$RUNNER_TEMP/release"/Thanos-*.dmg.sha256 "$RUNNER_TEMP/release/sbom.cdx.json"
